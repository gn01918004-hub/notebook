<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>測量入口網</title>
<style>
  :root {
    --bg: #f3f5f8; --panel: #fff; --text: #1c2530; --muted: #66727f;
    --line: #e1e6ec; --accent: #17698a; --accent-2: #2a8fb5; --accent-soft: #e5f2f7;
    --warn: #995a00; --warn-soft: #fff5e3; --ok: #187a3a; --ok-soft: #e6f5ec;
    --bad: #b42318; --local: #5b6470; --local-soft: #eef0f3;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11161c; --panel: #1a2129; --text: #e4e9ee; --muted: #98a4b0;
      --line: #2c3540; --accent: #4fb3d9; --accent-2: #2a8fb5; --accent-soft: #1d3340;
      --warn: #f0b45a; --warn-soft: #3a2c16; --ok: #5fcf8a; --ok-soft: #173326;
      --bad: #ff8a80; --local: #b4bdc6; --local-soft: #262e37; --shadow: none;
    }
    mark { background: #6b5a14; color: #fff; }
    .toolbar button { background: var(--panel); color: var(--text); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.75 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  a { color: var(--accent); }
  header {
    position: sticky; top: 0; z-index: 5; color: #fff;
    background: linear-gradient(90deg, #135a77, #1f7fa6);
    display: flex; gap: 16px; align-items: center; padding: 10px 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  header h1 small { font-size: 12px; font-weight: normal; opacity: .8; margin-left: 6px; }
  header h1 { margin: 0; font-size: 20px; white-space: nowrap; cursor: pointer; }
  header input { flex: 1; max-width: 520px; padding: 8px 12px; border: 0; border-radius: 6px; font: inherit; }
  #menuBtn { display: none; background: none; border: 1px solid #ffffff80; color: #fff; border-radius: 6px; font: inherit; padding: 4px 10px; }
  .layout { display: flex; max-width: 1200px; margin: 0 auto; }
  nav {
    width: 250px; flex-shrink: 0; padding: 14px 8px 40px 16px;
    position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; font-size: 15px;
  }
  nav .sec { margin: 18px 0 4px 10px; font-size: 12px; font-weight: bold; color: var(--muted); letter-spacing: .1em; }
  nav details > summary { cursor: pointer; padding: 4px 10px; border-radius: 6px; color: var(--text); list-style: none; }
  nav details > summary::before { content: '▸'; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
  nav details[open] > summary::before { transform: rotate(90deg); }
  nav details > summary:hover { background: var(--accent-soft); }
  nav details a { padding-left: 28px; }
  nav a { display: block; padding: 4px 10px; border-radius: 6px; text-decoration: none; color: var(--text); }
  nav a:hover { background: var(--accent-soft); }
  nav a.on { background: var(--accent); color: #fff; }
  nav .cnt { float: right; font-size: 12px; color: var(--muted); }
  nav a.on .cnt { color: #ffffffb0; }
  nav details.minor { margin-top: 6px; font-size: 13px; }
  nav details.minor > summary { color: var(--muted); }
  main { flex: 1; min-width: 0; padding: 20px 24px 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .hero { background: linear-gradient(135deg, var(--accent-soft), var(--panel) 70%); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 6px 0 14px; color: var(--muted); font-size: 14px; }
  .stats b { color: var(--accent); font-size: 20px; margin-right: 3px; }
  .group-h { margin: 14px 0 6px; font-size: 13px; font-weight: bold; color: var(--muted); letter-spacing: .08em; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .filters select, .filters input { font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  .filters input { flex: 1; min-width: 160px; }
  .tool-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 6px; text-decoration: none; border: 1px solid var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; }
  .tool { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--panel); }
  .tool b { display: block; }
  .tool small { display: block; color: var(--muted); line-height: 1.5; margin-top: 2px; }
  h2 { margin: 0 0 4px; font-size: 26px; }
  h3.card-h { margin: 0 0 10px; font-size: 18px; }
  .tag { display: inline-block; font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 10px; }
  h4 { margin: 22px 0 6px; font-size: 17px; border-left: 4px solid var(--accent); padding-left: 8px; }
  ul, ol { margin: 4px 0; padding-left: 24px; }
  li { margin: 2px 0; }
  .lead { font-size: 17px; }
  .key { background: var(--accent-soft); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .key b.lbl { display: block; font-size: 13px; color: var(--accent); margin-bottom: 2px; }
  .fees { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 8px; }
  .fee { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .fee b { display: block; margin-bottom: 2px; }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-top: 20px; font-size: 14px; }
  .fold { border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
  .fold > summary { cursor: pointer; padding: 10px 14px; font-weight: bold; }
  .fold > summary .meta { font-weight: normal; }
  .fold > div { padding: 0 14px 12px; }
  .law { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; background: var(--panel); }
  .law p { margin: 4px 0; }
  .law summary { cursor: pointer; list-style-position: outside; margin-left: 16px; }
  .law[open] summary { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .law.old { background: var(--bg); }
  .law.old summary b { color: var(--muted); }
  .gist { font-size: 14px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 9px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .lv-中央 { background: var(--accent-soft); color: var(--accent); }
  .lv-苗栗縣 { background: var(--ok-soft); color: var(--ok); }
  .lv-other { background: var(--local-soft); color: var(--local); }
  .ef-有效 { color: var(--ok); } .ef-已停止適用 { color: var(--bad); } .ef-待確認 { color: var(--warn); }
  .now { background: var(--ok-soft); border-left: 4px solid var(--ok); border-radius: 6px; padding: 8px 12px; margin: 8px 0 12px; }
  .now b { color: var(--ok); }
  .tl { position: relative; margin-left: 8px; padding-left: 18px; border-left: 2px solid var(--line); }
  .tl .law { position: relative; }
  .tl .law::before { content: ''; position: absolute; left: -26px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); }
  .tl .law.first::before { background: var(--ok); border-color: var(--ok); }
  .date { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; margin-right: 6px; }
  .topic { scroll-margin-top: 70px; }
  .art { padding: 10px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 70px; }
  .art p { margin: 4px 0; }
  .art.focus { background: var(--warn-soft); border-radius: 6px; padding: 10px; }
  .intent { font-size: 14px; color: var(--muted); }
  .intent summary { cursor: pointer; }
  .lawq { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; margin: 8px 0; }
  .toc ul { columns: 2; font-size: 14px; }
  .meta { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tile { display: block; text-decoration: none; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--panel); transition: border-color .15s, transform .15s; }
  .tile:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tile small { display: block; color: var(--muted); line-height: 1.5; margin-top: 2px; }
  .big { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .big a { display: block; text-decoration: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .big a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .big a { transition: border-color .15s, transform .15s; box-shadow: var(--shadow); }
  .big b { font-size: 18px; color: var(--accent); }
  .big small { display: block; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .hist .law { border-style: dashed; }
  .hist .cur { border: 2px solid var(--ok); }
  .todo { margin-top: 16px; font-size: 13px; color: var(--muted); }
  mark { background: #ffe58a; }
  .toolbar { float: right; }
  .toolbar button { font: inherit; font-size: 14px; padding: 4px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; cursor: pointer; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
  @media (max-width: 760px) {
    .layout { display: block; }
    #menuBtn { display: inline-block; }
    nav { display: none; position: static; width: auto; height: auto; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    nav.open { display: block; }
    main { padding: 12px 12px 40px; }
    .card { padding: 16px; }
    header { flex-wrap: wrap; padding: 10px 16px; }
    .toc ul { columns: 1; }
  }
  @media print {
    header, nav, .toolbar { display: none; }
    body { background: #fff; }
    .card { border: 0; padding: 0; }
    details { display: block; }
    .law { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <h1 onclick="location.hash=''">測量入口網<small>作業指引・函釋沿革・法規</small></h1>
  <button id="menuBtn" onclick="document.querySelector('nav').classList.toggle('open')">選單</button>
  <input id="q" type="search" placeholder="搜尋業務、函釋、法條…（例：協界、退費、0.25公頃、重劃）">
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script src="data.js"></script>
<script src="laws.js"></script>
<script src="laws_history.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = (arr, tag = 'ul') => `<${tag}>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</${tag}>`;
const paras = t => String(t || '').split('\n').map(p => `<p>${esc(p)}</p>`).join('');
const byId = (arr, id) => arr.find(x => x.id === id);
const href = (...p) => '#' + p.map(encodeURIComponent).join('/');
const groups = [...new Set(業務.map(b => b.分類))];
const 現行法規 = typeof 法規全文 === 'undefined' ? [] : 法規全文;
const 歷史法規 = typeof 歷史法規全文 === 'undefined' ? [] : 歷史法規全文;
const 法規表 = [...現行法規, ...歷史法規];
const 沿革表 = typeof 沿革 === 'undefined' ? [] : 沿革;
const 群組表 = typeof 分類群組 === 'undefined' ? [] : 分類群組;
const 已排序 = 群組表.flatMap(g => g.分類);
const 沿革分類 = [...new Set([...已排序, ...沿革表.map(t => t.分類)])].filter(c => 沿革表.some(t => t.分類 === c));
const 次要分類 = 沿革分類.filter(c => 沿革表.filter(t => t.分類 === c).every(t => t.次要));
const 主要分類 = 沿革分類.filter(c => !次要分類.includes(c));
const 分組 = [...群組表.map(g => ({ 名稱: g.名稱, 分類: g.分類.filter(c => 主要分類.includes(c)) })),
  { 名稱: '其他', 分類: 主要分類.filter(c => !已排序.includes(c)) }].filter(g => g.分類.length);
const 函釋 = 法規函釋.filter(l => l.類型 !== '法規');
const byDate = (a, b) => (b.日期 || '').localeCompare(a.日期 || '');
const rocDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-').map(Number); return `${y - 1911}.${m}.${dd}`; };

/* ---------- 共用元件 ---------- */
const artLabel = n => { if (n === '全文') return '全文'; const [a, b] = String(n).split('.'); return `第${a}條${b ? '之' + b : ''}`; };
const artHref = (lid, n) => href('法規全文', lid, ...(n ? [n] : []));
function findArt(ref) {
  const [lid, n] = ref.split(':'); const L = byId(法規表, lid);
  return L && { L, a: n ? L.條.find(a => a.號 === n) : null };
}
const lvBadge = l => l.層級 ? `<span class="badge ${l.層級 === '中央' || l.層級 === '苗栗縣' ? 'lv-' + l.層級 : 'lv-other'}" title="${l.層級 === '中央' || l.層級 === '苗栗縣' ? '' : '其他縣市函釋，僅供參考'}">${esc(l.層級)}${l.層級 === '中央' || l.層級 === '苗栗縣' ? '' : '・參考'}</span>` : '';
const efBadge = l => l.效力 ? `<span class="badge ef-${esc(l.效力)}">${esc(l.效力)}</span>` : '';
function artBlock(L, a) {
  const note = a.立法意旨 ? `<details class="intent"><summary>立法意旨／附註</summary>${paras(a.立法意旨)}</details>` : '';
  const ref = L.id + ':' + a.號;
  const ts = 沿革表.filter(t => (t.條文 || []).includes(ref));
  const ex = 函釋.filter(l => (l.條文 || []).includes(ref) && !ts.some(t => t.項目.includes(l.id)));
  const interp = ts.length || ex.length ? `<p class="meta interp">解釋函：${[
    ...ts.map(t => `<a href="${href('沿革', t.分類, t.id)}">${esc(t.名稱)}（${t.項目.length}則）</a>`),
    ...ex.map(l => `<a href="${href('函釋', l.id)}">${esc(l.名稱)}</a>`)].join('、')}</p>` : '';
  return `<div class="art" id="art-${esc(L.id)}-${esc(a.號)}"><b>${artLabel(a.號)}</b>${a.標題 ? `　<span class="meta">${esc(a.標題.replace(/^（|）$/g, ''))}</span>` : ''}${paras(a.內容)}${note}${interp}</div>`;
}
function lawBlock(l, opt = {}) {
  const topics = 沿革表.filter(t => t.項目.includes(l.id));
  const used = 業務.filter(b => (b.法規 || []).includes(l.id));
  const links = [
    ...(l.條文 || []).map(findArt).filter(x => x && x.a).map(({ L, a }) => `<a href="${artHref(L.id, a.號)}">${esc(L.名稱)} ${artLabel(a.號)}</a>`),
    ...topics.filter(t => t.id !== opt.topic).map(t => `<a href="${href('沿革', t.分類, t.id)}">沿革：${esc(t.名稱)}</a>`),
    ...(l.id === '收費標準' ? [] : used.map(b => `<a href="${href(b.id)}">${esc(b.名稱)}</a>`)),
  ];
  const old = l.效力 === '已停止適用';
  return `<details class="law${old ? ' old' : ''}${opt.first ? ' first' : ''}" id="law-${esc(l.id)}"${opt.open ? ' open' : ''}>
    <summary>${l.日期 ? `<span class="date">${rocDate(l.日期)}</span>` : ''}<b>${esc(l.名稱)}</b>${lvBadge(l)}${efBadge(l)}
    ${l.要旨 ? `<div class="gist">${esc(l.要旨)}</div>` : ''}</summary>
    <p class="meta">${esc([l.類型, l.字號].filter(Boolean).join('　'))}</p>${paras(l.內容)}
    ${links.length ? `<p class="meta">相關：${links.join('、')}</p>` : ''}</details>`;
}
function artRef({ L, a }) {
  return `<details class="law"><summary><b>${esc(L.名稱)} ${artLabel(a.號)}</b>${a.標題 ? `　<span class="meta">${esc(a.標題.replace(/^（|）$/g, ''))}</span>` : ''}
    <div class="gist">${esc(a.內容.split('\n')[0].slice(0, 60))}${a.內容.length > 60 ? '…' : ''}</div></summary>${artBlock(L, a)}
    <p class="meta"><a href="${artHref(L.id, a.號)}">到法規全文看前後條文 →</a></p></details>`;
}
const tile = (h, name, sub) => `<a class="tile" href="${h}">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}</a>`;
const toolTile = t => `<div class="tool"><b>${esc(t.名稱)}</b><small>${esc(t.說明)}</small><div class="tool-actions">
  ${t.連結 ? `<a class="btn primary" href="${esc(t.連結)}" target="_blank" rel="noopener">開啟</a>` : ''}${t.下載 ? `<a class="btn${t.連結 ? '' : ' primary'}" href="${esc(t.下載)}" rel="noopener">下載最新版</a>` : ''}</div></div>`;

/* ---------- 選單 ---------- */
function renderNav(active) {
  const on = k => active === k ? ' class="on"' : '';
  const grp = (title, items, openIf) => `<details${openIf ? ' open' : ''}><summary>${esc(title)}</summary>${items}</details>`;
  let h = `<a href="#"${on('')}>首頁</a>`;
  h += `<div class="sec">作業指引</div>`;
  for (const g of groups) {
    const bs = 業務.filter(b => b.分類 === g);
    h += grp(g, bs.map(b => `<a href="${href(b.id)}"${on(b.id)}>${esc(b.名稱)}</a>`).join(''), bs.some(b => b.id === active));
  }
  h += `<div class="sec">函釋沿革</div>`;
  const catLink = c => `<a href="${href('沿革', c)}"${on('沿革/' + c)}>${esc(c)}<span class="cnt">${沿革表.filter(t => t.分類 === c).length}</span></a>`;
  for (const g of 分組) {
    const open = g.分類.some(c => active === '沿革/' + c) || g === 分組[0];
    h += grp(g.名稱, g.分類.map(catLink).join(''), open);
  }
  h += `<a href="#函釋"${on('函釋')}>全部函釋（依日期）<span class="cnt">${函釋.length}</span></a>`;
  h += `<div class="sec">法規</div>`;
  h += 現行法規.map(L => `<a href="${artHref(L.id)}"${on('法規全文/' + L.id)}>${esc(L.名稱)}</a>`).join('');
  h += 法規函釋.filter(l => l.類型 === '法規').map(l => `<a href="${href('法規', l.id)}"${on('法規/' + l.id)}>${esc(l.名稱.replace(/（.*?）/g, ''))}</a>`).join('');
  h += `<a href="#歷史法規"${on('歷史法規') || (active || '').startsWith('法規全文/h') ? ' class="on"' : ''}>歷史法規沿革</a>`;
  h += `<div class="sec">其他</div><a href="#小工具"${on('小工具')}>小工具</a><a href="#共作區"${on('共作區')}>共作區（投稿・經驗分享）</a>`;
  if (次要分類.length) h += `<details class="minor"${次要分類.some(c => active === '沿革/' + c) ? ' open' : ''}><summary>其他函釋</summary>${次要分類.map(catLink).join('')}</details>`;
  $('#nav').innerHTML = h;
  $('#nav').classList.remove('open');
}

/* ---------- 首頁 ---------- */
function renderHome() {
  $('#main').innerHTML = `
    <div class="card hero">
      <h2>測量入口網</h2>
      <p class="lead">查業務怎麼辦、函釋怎麼演變、法條怎麼寫。上方搜尋框可以一次找全部。</p>
      <div class="stats"><span><b>${業務.length}</b>項作業指引</span><span><b>${沿革表.length}</b>個沿革主題</span><span><b>${函釋.length}</b>則函釋</span><span><b>${法規表.reduce((n, L) => n + L.條.length, 0)}</b>條法規條文</span></div>
      <div class="big">
        <a href="${href(業務[0].id)}"><b>作業指引</b><small>${業務.length} 項業務：應備文件、步驟、注意事項、收費</small></a>
        <a href="${href('沿革', 沿革分類[0])}"><b>函釋沿革</b><small>${沿革表.length} 個主題、${函釋.length} 則函釋，新舊見解一條線看清楚</small></a>

/* ---------- 搜尋 ---------- */
function textOf(o) {
  if (Array.isArray(o)) return o.map(textOf).join('　');
  if (o && typeof o === 'object') return Object.entries(o).filter(([k]) => !['id', '連結', '工具', '法規', '相關業務', '條文', '項目', '業務'].includes(k)).map(([, v]) => textOf(v)).join('　');
  return String(o ?? '');
}
/* 智慧搜尋：同義詞擴充＋錯字容忍（二字詞比對）＋相關度排序 */
const 同義詞表 = typeof 同義詞 === 'undefined' ? [] : 同義詞;
const 問句贅字 = ['怎麼辦', '怎麼', '如何', '什麼', '甚麼', '要帶', '需要', '可不可以', '能不能', '可以', '是否', '請問', '嗎', '呢', '哪些', '規定', '問題'];
const norm = t => String(t || '').toLowerCase().replace(/台/g, '臺').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248))
  .replace(/(\d)\.(\d)/g, '$1點$2').replace(/[\s　，。、；：「」『』（）()《》〈〉！？!?,.;:'"\-－—_~～／/\\|＊*]+/g, '').replace(/點/g, '.');

let 搜尋索引 = null;
function buildIndex() {
  const idx = [];
  const add = (sec, title, body, h, extra) => idx.push({ sec, title, body, h, extra, nt: norm(title), nb: norm(body) });
  for (const b of 業務) add('作業指引', b.名稱, textOf(b) + (b.收費 ? '　收費' : '') + (b.文件 ? '　文件' : ''), href(b.id));
  for (const t of 沿革表) add('函釋沿革', t.名稱, textOf(t), href('沿革', t.分類, t.id));
  for (const l of 法規函釋) add('函釋與法規', (l.日期 ? rocDate(l.日期) + ' ' : '') + l.名稱, textOf(l), l.類型 === '法規' ? href('法規', l.id) : href('函釋', l.id), { law: l });
  for (const L of 法規表) for (const a of L.條) add('法規條文', L.名稱 + ' ' + artLabel(a.號), (a.標題 || '') + ' ' + a.內容, artHref(L.id, a.號), { old: L.歷史 });
  for (const t of 小工具) add('小工具', t.名稱, textOf(t), null, { tool: t });
  return idx;
}
function expandTerms(q) {
  const raw = q.trim().split(/\s+/).map(norm).filter(Boolean);
  const out = [];
  for (const w of raw) {
    let core = w; for (const x of 問句贅字) core = core.split(x).join('');
    if (!core) core = w;
    // 找出句中出現的同義詞（長的優先），每個概念各成一組，必須都符合
    const found = [];
    let rest = core;
    const all = 同義詞表.flatMap((g, gi) => g.map(x => ({ x: norm(x), gi }))).sort((m, n) => n.x.length - m.x.length);
    for (const { x, gi } of all) if (x && rest.includes(x) && !found.some(f => f.gi === gi)) { found.push({ x, gi }); rest = rest.split(x).join('|'); }
    for (const f of found) {
      const ng = 同義詞表[f.gi].map(norm);
      out.push(ng);
      expandTerms.syn.push(...ng.filter(x => x !== f.x));
    }
    for (const piece of rest.split('|')) if (piece.length >= 2 || (!found.length && piece)) { const g = [piece]; g.opt = found.length > 0; out.push(g); }
  }
  return out.length ? out : [[norm(q)]];
}
function scoreDoc(d, groups) {

  for (const alts of groups) {
    let best = 0, ex = false;
    for (const a of alts) {
      if (d.nt.includes(a)) { best = Math.max(best, 12 + a.length); ex = true; continue; }
      if (d.nb.includes(a)) { best = Math.max(best, 6 + a.length / 2); ex = true; continue; }
      if (a.length < 3) continue;
      const bg = bigrams(a), hitT = bg.filter(x => d.nt.includes(x)).length, hitB = bg.filter(x => d.nb.includes(x)).length;
      const r = Math.max(hitT, hitB) / bg.length;
      if (r >= 0.6) best = Math.max(best, r * (hitT >= hitB ? 4 : 2));

function renderSearch(q) {

  const hl = s => { let h = esc(s); for (const k of marks) { const re = new RegExp(esc(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); h = h.replace(re, m => `<mark>${m}</mark>`); } return h.replace(/<\/mark><mark>/g, ''); };

  const exactN = res.filter(r => r.exact).length, anyExact = exactN > 0;

  const sec = name => shown.filter(r => r.d.sec === name);
  const row = r => r.d.extra && r.d.extra.tool ? '' : `<a class="tile" href="${r.d.h}" style="margin-bottom:8px">${hl(r.d.title)}${r.d.extra && r.d.extra.law ? lvBadge(r.d.extra.law) + efBadge(r.d.extra.law) : ''}${r.d.extra && r.d.extra.old ? '<span class="badge lv-other">已廢止</span>' : ''}<small>…${snippet(r.d.body)}…</small></a>`;
  const block = (name, max) => { const arr = sec(name); if (!arr.length) return ''; return `<h4>${name} <span class="meta">（${arr.length} 筆${arr.length > max ? `，顯示最相關的 ${max} 筆` : ''}）</span></h4>${arr.slice(0, max).map(row).join('')}`; };
  const extraWords = [...new Set(expandTerms.syn)].filter(x => !norm(q).includes(x));
  const tools = sec('小工具').map(r => r.d.extra.tool);
  $('#main').innerHTML = `<div class="card"><h2>搜尋：${esc(q)}</h2>
    ${extraWords.length ? `<p class="meta">也一併搜尋：${extraWords.slice(0, 8).map(esc).join('、')}</p>` : ''}
    ${!shown.length ? '<p class="meta">找不到相關內容。可以換個說法（例如「保登」→「保存登記」），或用空白分隔多個關鍵字。</p>' : !anyExact ? '<p class="banner">沒有完全符合的內容，以下是最接近的結果。</p>' : ''}
    ${block('作業指引', 10)}${block('函釋沿革', 10)}${block('函釋與法規', 20)}${block('法規條文', 20)}
    ${tools.length ? `<h4>小工具</h4><div class="grid">${tools.map(toolTile).join('')}</div>` : ''}
  </div>`;
}

/* ---------- 路由 ---------- */
function route() {
  const parts = location.hash.slice(1).split('/').map(decodeURIComponent);
  const [id, sub, sub2] = parts;
  const b = byId(業務, id);
  const L = id === '法規全文' && byId(法規表, sub);
  const law = id === '法規' && byId(法規函釋, sub);
  let active = '';
  if (b) active = b.id;
  else if (L) active = '法規全文/' + L.id;
  else if (law) active = '法規/' + law.id;
  else if (id === '沿革') active = '沿革/' + (sub || 沿革分類[0]);
  else if (['函釋', '歷史法規', '小工具', '共作區'].includes(id)) active = id;
  renderNav(active);
  window.scrollTo(0, 0);
  if (b) renderItem(b);
  else if (L) renderLawText(L, sub2);
  else if (law) renderLawEntry(law);
  else if (id === '沿革') renderTopics(sub || 沿革分類[0], sub2);
  else if (id === '函釋' || id === '法規函釋') renderAllRulings(sub);
  else if (id === '歷史法規') renderHistory();
  else if (id === '小工具') renderTools();
  else if (id === '共作區') renderCollab();
  else renderHome();
}

let 搜尋計時 = null;
$('#q').addEventListener('input', e => {
  clearTimeout(搜尋計時);
  搜尋計時 = setTimeout(() => { const q = e.target.value; if (q.trim()) { renderNav(null); renderSearch(q); } else route(); }, 150);
});
window.addEventListener('hashchange', () => { $('#q').value = ''; route(); });
route();
</script>
